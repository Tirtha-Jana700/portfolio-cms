<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Portfolio</title>

<meta name="description" content="Personal portfolio — projects, skills, and experience." />
<meta name="theme-color" content="#e6e7ee" />

<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="pre-reveal">

<div id="introScreen">
  <div class="intro-ring-wrap">
    <svg class="intro-ring" viewBox="0 0 120 120">
      <circle class="intro-ring-track" cx="60" cy="60" r="54" />
      <circle class="intro-ring-progress" cx="60" cy="60" r="54" />
    </svg>
    <div class="intro-avatar"><img id="introAvatarImg" src="" alt="" style="display:none" /></div>
  </div>
  <div class="intro-name" id="introName"></div>
  <div class="intro-title" id="introTitle"></div>
  <div class="intro-word">Portfolio</div>
</div>

<div id="mainContent">

  <nav class="nav">
    <div class="container nav-inner">
      <div class="nav-brand">Portfolio</div>
      <div class="nav-links" id="navLinks">
        <span class="nav-indicator" id="navIndicator"></span>
        <a href="#about" class="nav-link">About</a>
        <a href="#skills" class="nav-link">Skills</a>
        <a href="#projects" class="nav-link">Projects</a>
        <a href="#experience" class="nav-link">Experience</a>
        <a href="#contact" class="nav-link">Contact</a>
      </div>
    </div>
  </nav>

  <header class="hero container reveal">
    <button type="button" class="avatar-ring" id="avatarRing" aria-label="View story">
      <div class="avatar-frame" id="avatarFrame">
        <img id="avatarImg" src="" alt="" style="display:none" />
      </div>
    </button>
    <h1 id="heroName">&nbsp;</h1>
    <div class="title" id="heroTitle"></div>
    <p class="tagline" id="heroTagline"></p>
    <div class="hero-actions" id="heroActions"></div>
    <div class="social-row" id="socialRow"></div>
  </header>

  <section id="about" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">About</h2>
      <div class="card about-card">
        <p id="aboutBio"></p>
      </div>
    </div>
  </section>

  <section id="skills" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">Skills</h2>
      <p class="section-subtitle">What I work with day to day.</p>
      <div class="skills-grid" id="skillsGrid"></div>
    </div>
  </section>

  <section id="projects" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">Projects</h2>
      <p class="section-subtitle">A few things I've built.</p>

      <div class="projects-controls">
        <div class="projects-filters" id="projectsFilters">
          <button type="button" class="filter-pill active" data-filter="all">All</button>
          <button type="button" class="filter-pill" data-filter="starred">Starred</button>
        </div>
        <button type="button" class="icon-btn view-toggle-btn" id="viewToggleBtn" aria-label="Switch view"></button>
      </div>

      <div class="projects-viewport view-carousel" id="projectsViewport">
        <div class="projects-grid" id="projectsGrid"></div>
        <div class="projects-carousel" id="projectsCarousel">
          <div class="projects-carousel-track" id="projectsCarouselTrack"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="experience" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">Experience</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section id="contact" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">Get in touch</h2>
      <div class="contact-grid" id="contactGrid"></div>
    </div>
  </section>

  <footer>
    <span id="footerText"></span>
  </footer>

</div>

<!-- Story viewer -->
<div class="story-viewer hidden" id="storyViewer">
  <div class="story-viewer-inner">
    <div class="story-progress-row" id="storyProgressRow"></div>
    <div class="story-header">
      <div class="story-header-left">
        <img class="story-header-avatar" id="storyHeaderAvatar" src="" alt="" />
        <span class="story-header-name" id="storyHeaderName"></span>
        <span class="story-header-time" id="storyHeaderTime"></span>
      </div>
      <button type="button" class="story-close-btn" id="storyCloseBtn" aria-label="Close">&#10005;</button>
    </div>
    <div class="story-media-wrap" id="storyMediaWrap"></div>
    <button type="button" class="story-nav-zone story-nav-prev" id="storyPrevZone" aria-label="Previous story"></button>
    <button type="button" class="story-nav-zone story-nav-next" id="storyNextZone" aria-label="Next story"></button>
    <div class="story-caption hidden" id="storyCaption"></div>
  </div>
</div>

<!-- Full-image lightbox for project screenshots -->
<div class="image-lightbox hidden" id="imageLightbox">
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&#10005;</button>
  <img id="lightboxImg" src="" alt="" />
</div>

<script src="/js/main.js"></script>
</body>
</html>
