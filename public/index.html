<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Portfolio</title>

<meta name="description" content="Personal portfolio — projects, skills, and experience." />
<meta name="theme-color" content="#e6e7ee" />

<link rel="stylesheet" href="/css/style.css" />
</head>
<body class="pre-reveal">

<!-- Intro Splash Screen -->
<div id="introScreen">
  <div class="intro-ring-wrap">
    <svg class="intro-ring" viewBox="0 0 120 120">
      <circle class="intro-ring-track" cx="60" cy="60" r="54" />
      <circle class="intro-ring-progress" cx="60" cy="60" r="54" />
    </svg>
    <div class="intro-avatar"><img id="introAvatarImg" src="" alt="" style="display:none" /></div>
  </div>
  <div class="intro-name" id="introName"></div>
  <div class="intro-title" id="introTitle"></div>
  <div class="intro-word">Portfolio</div>
</div>

<!-- Story Viewer Modal -->
<div id="storyModal" class="story-modal hidden">
  <div class="story-modal-content card">
    <div class="story-progress-bars" id="storyProgressBars"></div>
    <div class="story-header">
      <div class="story-author-info">
        <div class="story-author-avatar"><img id="storyAuthorAvatar" src="" alt="" /></div>
        <span id="storyAuthorName">Story</span>
      </div>
      <button class="icon-btn story-close-btn" id="storyCloseBtn">&#10005;</button>
    </div>
    <div class="story-media-container" id="storyMediaContainer"></div>
    <div class="story-caption" id="storyCaption"></div>
  </div>
</div>

<div id="mainContent">

  <nav class="nav">
    <div class="container nav-inner">
      <div class="nav-brand">Portfolio</div>
      <div class="nav-links" id="navLinks">
        <span class="nav-indicator" id="navIndicator"></span>
        <a href="#about" class="nav-link">About</a>
        <a href="#skills" class="nav-link">Skills</a>
        <a href="#projects" class="nav-link">Projects</a>
        <a href="#experience" class="nav-link">Experience</a>
        <a href="#contact" class="nav-link">Contact</a>
      </div>
    </div>
  </nav>

  <header class="hero container reveal">
    <!-- Profile picture with Instagram story ring -->
    <div class="avatar-ring-wrapper" id="avatarRingWrapper">
      <div class="avatar-frame" id="avatarFrame" title="Tap to view story">
        <img id="avatarImg" src="" alt="" style="display:none" />
      </div>
    </div>
    <h1 id="heroName">&nbsp;</h1>
    <div class="title" id="heroTitle"></div>
    <p class="tagline" id="heroTagline"></p>
    <div class="hero-actions" id="heroActions"></div>
    <div class="social-row" id="socialRow"></div>
  </header>

  <section id="about" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">About</h2>
      <div class="card about-card">
        <p id="aboutBio"></p>
      </div>
    </div>
  </section>

  <section id="skills" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">Skills</h2>
      <p class="section-subtitle">What I work with day to day.</p>
      <div class="skills-grid" id="skillsGrid"></div>
    </div>
  </section>

  <!-- Projects Section with Filter, View Toggle, and Carousel / Infinite Auto-Scroll -->
  <section id="projects" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">Projects</h2>
      <p class="section-subtitle">A few things I've built.</p>
      
      <div class="projects-controls">
        <div class="filter-group">
          <button class="btn filter-btn active" data-filter="all">All</button>
          <button class="btn filter-btn" data-filter="starred">★ Starred</button>
        </div>
        <div class="view-toggle-group">
          <button class="icon-btn view-btn active" id="gridViewBtn" title="Grid View">&#9638;</button>
          <button class="icon-btn view-btn" id="carouselViewBtn" title="Carousel / Auto-Scroll View">&#8644;</button>
        </div>
      </div>

      <div class="projects-container grid-view" id="projectsContainer">
        <div class="projects-grid" id="projectsGrid"></div>
        <div class="projects-carousel hidden" id="projectsCarousel">
          <div class="carousel-track" id="carouselTrack"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="experience" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">Experience</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section id="contact" class="hidden reveal">
    <div class="container">
      <h2 class="section-title">Get in touch</h2>
      <div class="contact-grid" id="contactGrid"></div>
    </div>
  </section>

  <footer>
    <span id="footerText"></span>
  </footer>

</div>

<script src="/js/main.js"></script>
</body>
</html>
